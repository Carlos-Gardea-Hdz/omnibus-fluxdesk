# Local development stack (Laravel Sail style) for omnibus-fluxdesk (FluxDesk).
# Infra-as-code (Law 3). Host ports are remapped to avoid clashing with the other
# OMNIBUS Sail stacks on the same machine (cms 8088/5433/6380,
# uniges 8090/5434/6381, corporatenexus 8092/5436/6383).
#
# The `laravel.test` service is a full PHP 8.5 app container (built from Sail's
# vendored 8.5 runtime) so the standard gate loop works:
#   docker compose exec -T laravel.test <cmd>
#
# Production/staging use the compose.staging.* files, not this one.
services:
  laravel.test:
    build:
      context: ./vendor/laravel/sail/runtimes/8.5
      dockerfile: Dockerfile
      args:
        WWWGROUP: '${WWWGROUP:-1000}'
    image: sail-8.5/app
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    ports:
      - '${APP_PORT:-8093}:80'
      - '${VITE_PORT:-5177}:${VITE_PORT:-5177}'
    environment:
      WWWUSER: '${WWWUSER:-1000}'
      LARAVEL_SAIL: 1
      XDEBUG_MODE: '${SAIL_XDEBUG_MODE:-off}'
      XDEBUG_CONFIG: '${SAIL_XDEBUG_CONFIG:-client_host=host.docker.internal}'
      IGNITION_LOCAL_SITES_PATH: '${PWD}'
    volumes:
      - '.:/var/www/html'
    networks:
      - sail
    depends_on:
      - pgsql
      - valkey

  pgsql:
    image: postgres:18
    environment:
      POSTGRES_DB: ${DB_DATABASE:-fluxdesk}
      POSTGRES_USER: ${DB_USERNAME:-fluxdesk}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secret}
    ports:
      - '${FORWARD_DB_PORT:-5437}:5432'
    volumes:
      # postgres:18 expects the data volume at /var/lib/postgresql (it stores the
      # cluster in a versioned subdir); mounting .../data trips the init guard.
      - fluxdesk-pgsql:/var/lib/postgresql
      # Creates the *_test database on first init so Pest never hits dev data.
      - './docker/pgsql/create-testing-database.sql:/docker-entrypoint-initdb.d/10-create-testing-database.sql'
    networks:
      - sail
    healthcheck:
      test: ['CMD', 'pg_isready', '-q', '-d', '${DB_DATABASE:-fluxdesk}', '-U', '${DB_USERNAME:-fluxdesk}']
      interval: 10s
      timeout: 5s
      retries: 5

  valkey:
    image: valkey/valkey:8
    ports:
      - '${FORWARD_REDIS_PORT:-6384}:6379'
    volumes:
      - fluxdesk-valkey:/data
    networks:
      - sail
    healthcheck:
      test: ['CMD', 'valkey-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  sail:
    driver: bridge

volumes:
  fluxdesk-pgsql:
  fluxdesk-valkey:
